// keep track if we are changing volume by dragging a finger
var isDragging = false;

// function to display pop up message for a short time
function popup(message) {
    const player = document.getElementById('player');
    const popup = document.createElement('div');
    popup.textContent = message;
    popup.style.position = 'fixed';
    popup.style.fontFamily = 'monospace';
    popup.style.fontSize = '3em';
    popup.style.textShadow = '0.1em 0.1em 0.2em black';
    popup.style.bottom = '20%';
    popup.style.left = '50%';
    popup.style.transform = 'translateX(-50%)';
    popup.style.color = 'white';
    popup.style.zIndex = '100';
    player.appendChild(popup);

    setTimeout(() => {
        player.removeChild(popup);
    }, 1000);
}

// visual effects, video screen wiggles to the left or right
function effectScrollLeft() {
    const videowrap = document.getElementById('videowrap');
    videowrap.animate([
        { transform: 'translateX(0px)' },
        { transform: 'translateX(-70vw)' },
        { transform: 'translateX(0px)' }
    ], {
        duration: 300,
        iterations: 1
    });
}

function effectScrollRight() {
    const videowrap = document.getElementById('videowrap');
    videowrap.animate([
        { transform: 'translateX(0px)' },
        { transform: 'translateX(70vw)' },
        { transform: 'translateX(0px)' }
    ], {
        duration: 300,
        iterations: 1
    });
}

// stolen from https://stackoverflow.com/questions/62823062/adding-a-simple-left-right-swipe-gesture
function registerTouchEvent(element, callback) {
  const THRESHOLD = 50 // Minimum difference in pixels at which a swipe gesture is detected

  let startEvent
  element.addEventListener('touchstart', ev => startEvent = ev)

  element.addEventListener('touchend', endEvent => {
    if (!startEvent.changedTouches || !endEvent.changedTouches) return

    const start = startEvent.changedTouches[0]
    const end = endEvent.changedTouches[0]
    if (!start || !end) return

    const horizontalDifference = start.screenX - end.screenX
    const verticalDifference = start.screenY - end.screenY
    const horizontal = Math.abs(horizontalDifference) > Math.abs(verticalDifference) && Math.abs(verticalDifference) < THRESHOLD
    const vertical = !horizontal && Math.abs(horizontalDifference) < THRESHOLD

    let direction = 'diagonal';
    if (horizontal) direction = horizontalDifference >= THRESHOLD ? 'left' : (horizontalDifference <= -THRESHOLD ? 'right' : 'click')
    if (vertical) direction = verticalDifference >= THRESHOLD ? 'up' : (verticalDifference <= -THRESHOLD ? 'down' : 'click')

    callback(direction, startEvent, endEvent)
  })
}

function sizeRemote() {
    var fr = document.getElementById("remoteframe");
    var r_el = document.getElementById("remote");
    if (fr.contentDocument) {
        r_el.width = fr.contentDocument.documentElement.scrollWidth+30; //FF 3.0.11, Opera 9.63, and Chrome
    } else {
        r_el.width = fr.contentWindow.document.body.scrollWidth+30; //IE6, IE7 and Chrome
    }
}

function swipeHandler(direction, startEvent, endEvent) {
    console.log("Swipe detected: " + direction);
    if (isDragging) {
        console.log("Dragging detected, ignoring swipe");
        return; // Ignore swipes while dragging
    }

    if (direction === 'up' || direction === 'right') {
        effectScrollRight();
        sendCode('fromSwipe_up', chup_code); // ArrowUp
    } else if (direction === 'down' || direction === 'left') {
        effectScrollLeft();
        sendCode('fromSwipe_down', chdown_code); // ArrowDown
//    } else if (direction === 'click') {
//        toggleRemoteAndControls();
    }
}

function bodyLoad() {
    sizeRemote(); // Set remote size, does not seem to work
    videowrap = document.getElementById('videowrap');
    registerTouchEvent(videowrap, swipeHandler);

    // change video volume by dragging your finger along the right side of the screen
    document.addEventListener('touchstart', (e) => {
        const touchX = e.touches[0].clientX;
        if (touchX > window.innerWidth - 50) {
            isDragging = true;
            event.preventDefault();
            event.stopPropagation();
        }
    });
    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touchY = e.touches[0].clientY;
        const volume = 1 - (touchY / window.innerHeight);
        video.volume = Math.min(Math.max(volume, 0), 1);
        popup(`Vol ${Math.round(video.volume * 100)}%`);
        event.preventDefault();
        event.stopPropagation();
    });
    document.addEventListener('touchend', () => {
        isDragging = false;
    });

    document.addEventListener('touchcancel', () => {
        isDragging = false;
    });
};

function getSeekableEnd(v) {
    const r = v.seekable;
    if (r && r.length && r.end(r.length - 1)>0) {
        // chrome will have 0 as the seekable end and cannot seek
        // for firefox, v.seekable will be the same as v.buffered, but we'll use buffered just in case
        const b = v.buffered;
        return (b && b.length) ? b.end(b.length - 1) : NaN;
    };
    return NaN;
};

function videoStatusBar() {
    const video = document.getElementById('video');
    const progress_status = document.getElementById('cnt_status');
    const state = video.readyState;
    const paused_str = video.paused ? "paused" : "";
    const playing_str = video.playing ? "playing" : "";
    const ended_str = video.ended ? "ended" : "";
    const nosrc = !video.src || video.src === "" ? "no source" : "";
    edge = getSeekableEnd(video);
    if (!Number.isFinite(edge)) {
        edge = video.duration;
    };
    const latency = edge - video.currentTime;
    let case_str = "???";
    switch (state) {
        case 0:
            state_str = "NOTHING";
            break;
        case 1:
            state_str = "METADATA";
            break;
        case 2:
            state_str = "CURRENT_DATA";
            break;
        case 3:
            state_str = "FUTURE_DATA";
            break;
        case 4:
            state_str = "ENOUGH_DATA";
            break;
    };
    progress_status.innerHTML = `state: ${state_str} ${nosrc} ${paused_str} ${ended_str} ${playing_str} time: ${video.currentTime.toFixed(2)}/${video.duration.toFixed(2)}s latency: ${latency.toFixed(2)}s`;

    if (video.buffered && video.buffered.length) {
        buffered_start = video.buffered.start(video.buffered.length - 1);
        // buffered end is the edge
        // put a marker in the progress_status div corresponding to the current time
        const buffered_pos = video.currentTime / (edge - buffered_start); // between 0 and 1
        const marker_pos = Math.min(Math.max(buffered_pos, 0), 1) * 100;
        const marker = document.getElementById('currentTimeMarker');
        if (marker) {
            marker.style.position = 'absolute';
            marker.style.left = marker_pos + '%';
            marker.style.color = 'white';
            marker.style.textShadow = '0.2em 0.2em 0.4em black';
            marker.innerHTML = '⬆';
        };
    } else {
        const marker = document.getElementById('currentTimeMarker');
        if (marker) {
            marker.innerHTML = '';
        };
    };
};

function videoRewind() {
    const v = document.getElementById('video');
    const state = v.readyState;
    if (!v.src || !v.seekable || v.seekable.length === 0)  {
        popup("Not seekable");
        return;
    }
    if (v.readyState >= 1) { // HAVE_METADATA
        seekableend = getSeekableEnd(v);
        if (!seekableend) {
            popup("No seekable end");
            return;
        }
        let delta = 10;
        if (seekableend - v.currentTime < 5) {
            delta = 2;
        }
        v.currentTime = Math.max(v.currentTime - delta, 0);
        popup(-delta+"s");
    }
};

// clicking on status bar rewinds video to that point
function videoRewindTo() {
    const v = document.getElementById('video');
    const state = v.readyState;
    if (!v.src || !v.seekable || v.seekable.length === 0)  {
        popup("Not seekable");
        return;
    }
    if (v.readyState >= 1) { // HAVE_METADATA
        seekableend = getSeekableEnd(v);
        if (!seekableend) {
            popup("No seekable end");
            return;
        }
        const progress_status = document.getElementById('cnt_status_bar');
        const rect = progress_status.getBoundingClientRect();
        const clickX = event.clientX - rect.left; // X coordinate within the element
        const width = rect.width;
        const clickRatio = clickX / width; // between 0 and 1
        const buffered_start = v.buffered && v.buffered.length ? v.buffered.start(v.buffered.length - 1) : 0;
        const newTime = buffered_start + clickRatio * (seekableend - buffered_start);
        v.currentTime = Math.min(Math.max(newTime, 0), seekableend);
        popup(`seek to ${v.currentTime.toFixed(1)}s`);
    }
};

function videoFF() {
    const v = document.getElementById('video');
    const state = v.readyState;
    if (!v.src ||  !v.seekable || v.seekable.length === 0) {
        popup("Not seekable");
        return;
    }
    if (v.readyState >= 1) { // HAVE_METADATA
        seekableend = getSeekableEnd(v);

        }
        v.currentTime = Math.min(v.currentTime + 10, seekableend);
        popup("+10s");

};

// tracks the timestamp of video errors
var videoErrTimestamp = 0;

function forceVideoStart() {
    video.src = "/"+slingbox_id+"?remux=1";
    if (forced_resolution) {
        video.src += "&resolution=" + forced_resolution;
    }
    if (forced_bitrate) {
        video.src += "&bitrate=" + forced_bitrate;
    }
    video.load();
    videoStatusBar();
}

function videoPlayPause() {
    console.log("video play request");
    const video = document.getElementById('video');

    if (!video.src || video.src === "") {
        console.log("Setting video source");
        forceVideoStart();
        consoleWindowOn();
    };

    const button = document.getElementById('cnt_videoplay');

    if (video.paused) {
        popup("Play");
        playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log("Video is playing");
                videoStatusBar();
                consoleWindowOff();
                button.innerHTML = "⏸ Pause";
            }).catch(error => {
                console.error("Error playing video:", error);
                popup("Error playing video");
                button.innerHTML = "⚠ Err";
            });
        } else {
            console.log("play promise undefined");
        }
    } else if (video.playing) {
        video.pause();
        popup("Paused");
    }
    if (video.paused || video.ended) {
        button.innerHTML = "⏵ Play"
    } else if (video.playing) {
        button.innerHTML = "⏸ Pause";
    } else if (video.paused && video.ended) {
        button.innerHTML = "⚠ Err";
    } else {
        button.innerHTML = "⌛ Play";
    }
};


function forceVideoStop() {
    const video = document.getElementById('video');
    if (video.playing) {
        video.pause();
    }
    setTimeout(() => {
        if (video.src) {
            video.src = "";
        }
        video.removeAttribute('src');
    }, 100);
    setTimeout(() => {
        if (!video.src || video.src === "") {
            video.load();
        }
    }, 200);
}

function videoStop() {
    console.log("video stop request");
    popup("Stop");
    forceVideoStop();
    const button = document.getElementById('cnt_videoplay');
    button.innerHTML = "⏵ Play";
    videoStatusBar();
};

function consoleWindowOn() {
    var console_window = document.getElementById('console_window');
    console_window.style.display = 'block';
    const button = document.getElementById('cnt_consolewindow');
    button.innerHTML = "✖ Log";
}

function consoleWindowOff() {
    var console_window = document.getElementById('console_window');
    console_window.style.display = 'none';
    const button = document.getElementById('cnt_consolewindow');
    button.innerHTML = "🖥 Log";
}

function toggleConsoleWindow() {
    popup("Toggle console");
    var console_window = document.getElementById('console_window');
    if (console_window.style.display === 'none' || console_window.style.display === '') {
        consoleWindowOn();
    } else {
        consoleWindowOff();
    }
    event.stopPropagation();
}

function toggleRemote() {
    popup("Toggle remote");
    var remoteDiv = document.getElementById('remote');
    if (remoteDiv.style.display === 'none' || remoteDiv.style.display === '') {
        remoteDiv.style.display = 'block'; // Show the remote and controls
    } else {
        remoteDiv.style.display = 'none'; // Hide the remote and controls
    }
    event.stopPropagation();
}

function toggleRemoteAndControls() {
    var videocontrolsDiv = document.getElementById('videocontrols');
    var remoteDiv = document.getElementById('remote');
    toggleRemote(); // Toggle remote visibility

    // make the video control follow the remote visibility
    if (remoteDiv.style.display === 'none' || remoteDiv.style.display === '') {
        videocontrolsDiv.style.display = 'none';
    } else {
        videocontrolsDiv.style.display = 'block';
    }
}

function toggleMute() {
    popup("Toggle mute");
    if (video.muted) {
        video.muted = false;
    } else {
        video.muted = true;
    }
    const button = document.getElementById('cnt_mute');
    button.innerHTML = video.muted ? "🔇 Mute" : "🔈 Mute";
};

function toggleFullscreen() {
    const player = document.getElementById('player');
    const button = document.getElementById('cnt_fullscreen');

    popup("fullscreen");

    if (document.fullscreenElement) {
        document.exitFullscreen();
        button.innerHTML = '<sup>⇱</sup><sub>⇲</sub> FullScr';
    } else {
        player.requestFullscreen = player.requestFullscreen || player.webkitRequestFullscreen || player.mozRequestFullScreen || player.msRequestFullscreen;
        player.requestFullscreen().catch(err => {
            console.error(`Error attempting full-screen: ${err.message} (${err.name})`);
        });
        button.innerHTML = '<sup>⇲</sup><sub>⇱</sub> FullScr';
    };
};

function toggleAspect() {
    const videoaspect = document.getElementById('videoaspect');
    const button = document.getElementById('cnt_aspect');
    //toggle three states: 16/9, 4/3, aspect ratio of your window
    if (videoaspect.style.aspectRatio === '16 / 9') {
        videoaspect.style.aspectRatio = '4 / 3';
        button.innerHTML = '4/3';
    } else if (videoaspect.style.aspectRatio === '4 / 3') {
        videoaspect.style.aspectRatio = `${window.innerWidth / window.innerHeight}`;
        button.innerHTML = '⛶ ';
    } else {
        videoaspect.style.aspectRatio = '16 / 9';
        button.innerHTML = '16/9';
    }
};

function goEnd() {
    const v = document.getElementById('video');
    const state = v.readyState;
    if (v.readyState >= 2) { // HAVE_CURRENT_DATA
        seekableend = getSeekableEnd(v);
        if (seekableend && seekableend > 2 && v.currentTime < seekableend - 2.5) {
            /* go to the end of the video, but leave some time for buffering
              empirically found out that 2s causes some slight stuttering in Firefox sometimes
              but slightly bigger value is OK
            */
            v.currentTime = seekableend - 2.3;
            console.log("Seeking to end of video at", v.currentTime);
        }
    }
};

function forceVideoRestart() {
    console.log("Force video restart");
    popup('Restarting video...');
    forceVideoStop();
    // sleep some time to let the video element reset
    setTimeout(() => {
        forceVideoStart();
    }, 500);
}

const irFlash = [
  { color: "red" },
  { color: "white" },
];

const irFlashTiming = {
  duration: 100,
  iterations: 1,
};


function sendCode(buttonName, buttonValue) {
    goEnd();
    popup('IR '+buttonValue);
    const dataString = encodeURIComponent(buttonName) + '=' + encodeURIComponent(buttonValue);
    const xhr = new XMLHttpRequest(); // Create XHR object
    xhr.open('POST', ''); // Set request method and URL
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onload = () => {
      if (xhr.status === 200) {
        // console.log('Button code submitted successfully:', buttonName, buttonValue);
          ir_elem = document.getElementById('ir');
          if (ir_elem) {
                ir_elem.style.display = 'block';
                document.getElementById('ir').animate(irFlash, irFlashTiming);
                setTimeout(() => {
                    ir_elem.style.display = 'none';
                }, 250);
            } else {
                console.log('No IR element found');
            }
      } else {
        console.error('Error submitting:', xhr.statusText);
        popup('IR error');
      }
    };
    xhr.send(dataString);
}


function handleKey(event) {
    //console.log('KBD detected:', event.key);

    // if the key is a Tab, toggle remote
    if (event.key === 'Tab') {
        toggleRemoteAndControls();
        event.preventDefault(); // Prevent default tab behavior
        return;
    }

    // if in INPUT, return
    if (event.target.tagName === 'INPUT') {
        return;
    }

    // if in localKeyMap, handle locally
    if (localKeyMap.has(event.key)) {
        event.preventDefault();
        const action = localKeyMap.get(event.key);
        if (action === 'showhidelog') {
            toggleConsoleWindow();
        } else if (action === 'showhideremote') {
            toggleRemoteAndControls();
        } else if (action === 'togglefullscreen') {
            toggleFullscreen();
        }
        return;
    }

    const name = 'fromKBD_'+event.keyCode ;
    if (keyMap.has(event.key)) {
        event.preventDefault();
        const value = keyMap.get(event.key);
        sendCode(name, value);
    }
};


document.getElementById('videowrap').addEventListener('keydown', handleKey);
document.getElementById('videocontrols').addEventListener('keydown', handleKey);
