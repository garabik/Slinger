<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Slinger WebPlay</title>
    <!-- 
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <script>
// control the remote with your keyboard
const keyMap = new Map();

// event.key, slingbox keycode
keyMap.set('0',         18);
keyMap.set('1',          9);
keyMap.set('2',         10);
keyMap.set('3',         11);
keyMap.set('4',         12);
keyMap.set('5',         13);
keyMap.set('6',         14);
keyMap.set('7',         15);
keyMap.set('8',         16);
keyMap.set('9',         17);
keyMap.set('Enter',     42);
keyMap.set(' ',         42);
keyMap.set('ArrowRight',41);
keyMap.set('ArrowLeft', 40);
keyMap.set('ArrowUp',   38);
keyMap.set('ArrowDown', 39);
keyMap.set('M',          8); // mute
keyMap.set('g',         35); // guide
keyMap.set('s',         64); // sat
keyMap.set('f',         63); // fav
keyMap.set('i',         46); // info
keyMap.set('x',         36); // exit
keyMap.set('p',          1); // power
keyMap.set('m',         33); // menu
keyMap.set('PageUp',    44);
keyMap.set('PageDown',  43);
keyMap.set('R',  74);
keyMap.set('G',  75);
keyMap.set('Y',  76);
keyMap.set('B',  77);
    </script>

    <style>

html, body {
  height:100%;
  width:100%;
  margin:0;
}

#player {
  display: flex;
  flex-wrap: wrap;
  flex-direction: row;
}

#remote {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  max-width: 100%;
  width: 35vw;
  justify-content: left;
  align-items: center;
  border: none;
  background-color: rgba(0, 0, 0, 0.2);
  z-index: 20;
}

#remote iframe {
  width: 100%;
  height: 100%;
  border: none;
  overflow: scroll;
  display: block;
}

#video {
  object-fit: fill;
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;
  background-color: #008;
}

#videoaspect {
  object-fit: contain;
  max-width: 100vw;
  max-height: 100vh;
  padding: 0;
  margin-left: auto;
  margin-right: 0;
  overflow: hidden;
  background-color: yellow;
  aspect-ratio: 16 / 9;
  z-index: 1;
}

#videowrap {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: auto;
  background-color: rgba(.1, 0, .1, 0.2);
  z-index: 10;
}

#videocontrols {
  position: absolute;
  bottom: 0;
  left: 40vw;
  width: 50vw;
  z-index: 30;
}

#videocontrols button {
  background-color: #333;
  color: white;
  border: none;
  border-radius: 0.3em;
  padding: 0.5em 0.5em;
  margin: 0.2em;
  cursor: crosshair;
  font-family: monospace;
  height: 5ex;
}

#ir {
  color: white;
  background-color: gray;
  border-radius: 0.3em;
  position: absolute;
  display: none;
}

    </style>
</head>

<body onload="bodyLoad();">

<div id="player">
  <div id="ir" style="display:none;">⇈ </div>
  <div id="remote" style="display: none;">
    <iframe id="remoteframe" src="Remote.html" frameborder="0"></iframe>
  </div>
  <div id="videocontrols">
    <button id="cnt_videoplay" onclick="videoPlayPause();">⏵ Play</button>
    <button id="cnt_videostop" onclick="videoStop();">⏹ Stop</button>
    <button id="cnt_fullscreen" onclick="toggleFullscreen();"><sup>⇱</sup><sub>⇲</sub> Fullscreen</button>
    <button id="cnt_remotebutton" onclick="toggleRemote();">&#x1F3AE; Remote</button>
    <button id="cnt_mute" onclick=toggleMute();>&#x1F507; Mute</button>
    <button id="cnt_aspect" onclick="toggleAspect();">16/9</button>
  </div>
  <div id="videowrap" onclick="toggleRemoteAndControls();" ondblclick="toggleFullscreen();">
      <div id="videoaspect">
        <video id="video" preload="none" > <!-- onclick="toggleRemote()" -->
              <!--            <source id="videosource" src="none" type="video/mp4" /> -->
            Your browser does not support the video tag.
        </video>
      </div> <!-- videoaspect -->
  </div> <!-- videowrap -->
</div> <!-- player -->

<script>

var slingbox_id = 'slingbox';
const queryString = window.location.search;
console.log("QS "+queryString);
const urlParams = new URLSearchParams(queryString);
if (urlParams.has('slingbox_id')) {
    slingbox_id = urlParams.get('slingbox_id');
};

// keep track if we are changing volume by dragging a finger
var isDragging = false;

// function to display pop up message for a short time
function popup(message) {
    const player = document.getElementById('player');
    const popup = document.createElement('div');
    popup.textContent = message;
    popup.style.position = 'fixed';
    popup.style.fontFamily = 'monospace';
    popup.style.fontSize = '3em';
    popup.style.textShadow = '0.1em 0.1em 0.2em black';
    popup.style.bottom = '20%';
    popup.style.left = '50%';
    popup.style.transform = 'translateX(-50%)';
    popup.style.color = 'white';
    popup.style.zIndex = '100';
    player.appendChild(popup);

    setTimeout(() => {
        player.removeChild(popup);
    }, 500);
}

// stolen from https://stackoverflow.com/questions/62823062/adding-a-simple-left-right-swipe-gesture
function registerTouchEvent(element, callback) {
  const THRESHOLD = 50 // Minimum difference in pixels at which a swipe gesture is detected

  let startEvent
  element.addEventListener('touchstart', ev => startEvent = ev)

  element.addEventListener('touchend', endEvent => {
    if (!startEvent.changedTouches || !endEvent.changedTouches) return

    const start = startEvent.changedTouches[0]
    const end = endEvent.changedTouches[0]
    if (!start || !end) return

    const horizontalDifference = start.screenX - end.screenX
    const verticalDifference = start.screenY - end.screenY
    const horizontal = Math.abs(horizontalDifference) > Math.abs(verticalDifference) && Math.abs(verticalDifference) < THRESHOLD
    const vertical = !horizontal && Math.abs(horizontalDifference) < THRESHOLD

    let direction = 'diagonal';
    if (horizontal) direction = horizontalDifference >= THRESHOLD ? 'left' : (horizontalDifference <= -THRESHOLD ? 'right' : 'click')
    if (vertical) direction = verticalDifference >= THRESHOLD ? 'up' : (verticalDifference <= -THRESHOLD ? 'down' : 'click')

    callback(direction, startEvent, endEvent)
  })
}

function sizeRemote() {
    var fr = document.getElementById("remoteframe");
    var r_el = document.getElementById("remote");
    if(fr.contentDocument) {
        r_el.width = fr.contentDocument.documentElement.scrollWidth+30; //FF 3.0.11, Opera 9.63, and Chrome
    } else {
        r_el.width = fr.contentWindow.document.body.scrollWidth+30; //IE6, IE7 and Chrome
    }
}

function swipeHandler(direction, startEvent, endEvent) {
    console.log("Swipe detected: " + direction);
    if (isDragging) {
        console.log("Dragging detected, ignoring swipe");
        return; // Ignore swipes while dragging
    }

    if (direction === 'up' || direction === 'right') {
        sendCode('fromSwipe_up', 38); // ArrowUp
    } else if (direction === 'down' || direction === 'left') {
        sendCode('fromSwipe_down', 39); // ArrowDown
//    } else if (direction === 'click') {
//        toggleRemoteAndControls();
    }
}

function bodyLoad() {
    sizeRemote(); // Set remote size, does not seem to work
    videowrap = document.getElementById('videowrap');
    registerTouchEvent(videowrap, swipeHandler);

    // change video volume by dragging your finger along the right side of the screen
    document.addEventListener('touchstart', (e) => {
        const touchX = e.touches[0].clientX;
        if (touchX > window.innerWidth - 50) {
            isDragging = true;
            event.preventDefault();
            event.stopPropagation();
        }
    });
    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touchY = e.touches[0].clientY;
        const volume = 1 - (touchY / window.innerHeight);
        video.volume = Math.min(Math.max(volume, 0), 1);
        popup(`Vol ${Math.round(video.volume * 100)}%`);
        event.preventDefault();
        event.stopPropagation();
    });
    document.addEventListener('touchend', () => {
        isDragging = false;
    });

    document.addEventListener('touchcancel', () => {
        isDragging = false;
    });
};

function videoPlayPause() {
    console.log("video play request");
    let video_random_id = Math.round(Math.random() * 1000000);
    const video = document.getElementById('video');

    if (!video.src || video.src === "") {
        console.log("Setting video source");
        video.src = "/"+slingbox_id+"?remux=1&dummy=" + video_random_id;
        video.load(); // Load the new source
    };

    if (video.paused) {
        popup("Play");
        video.play().catch(error => {
            console.error("Error playing video:", error);
            popup("Error playing video");
        });
    } else {
        video.pause();
        popup("Paused");
    }
    const button = document.getElementById('cnt_videoplay');
    button.innerHTML = video.paused ? "⏵ Play" : "⏸ Pause";
};

function videoStop() {
    console.log("video stop request");
    popup("Stop");
    let video = document.getElementById('video');
    video.pause();
    video.src = "";
    video.removeAttribute('src');
    video.load(); // Load the video element to reset it
    const button = document.getElementById('cnt_videoplay');
    button.innerHTML = "⏵ Play";
};

function toggleRemote() {
    popup("Toggle remote");
    var remoteDiv = document.getElementById('remote');
    if (remoteDiv.style.display === 'none' || remoteDiv.style.display === '') {
        remoteDiv.style.display = 'block'; // Show the remote and controls
    } else {
        remoteDiv.style.display = 'none'; // Hide the remote and controls
    }
    event.stopPropagation();
}

function toggleRemoteAndControls() {
    var videocontrolsDiv = document.getElementById('videocontrols');
    var remoteDiv = document.getElementById('remote');
    toggleRemote(); // Toggle remote visibility

    // make the video control follow the remote visibility
    if (remoteDiv.style.display === 'none' || remoteDiv.style.display === '') {
        videocontrolsDiv.style.display = 'none';
    } else {
        videocontrolsDiv.style.display = 'block';
    }
}

function toggleMute() {
    popup("Toggle mute");
    var video = document.getElementById('video');
    if (video.muted) {
        video.muted = false;
    } else {
        video.muted = true;
    }
    const button = document.getElementById('cnt_mute');
    button.innerHTML = video.muted ? "🔇 Mute" : "🔈 Mute";
};

function toggleFullscreen() {
    const player = document.getElementById('player');
    const button = document.getElementById('cnt_fullscreen');

    popup("fullscreen");

    if (document.fullscreenElement) {
        document.exitFullscreen();
        button.innerHTML = '<sup>⇱</sup><sub>⇲</sub> Fullscreen';
    } else {
        player.requestFullscreen = player.requestFullscreen || player.webkitRequestFullscreen || player.mozRequestFullScreen || player.msRequestFullscreen;
        player.requestFullscreen().catch(err => {
            console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
        button.innerHTML = '<sup>⇲</sup><sub>⇱</sub> Fullscreen';
    };
};

function toggleAspect() {
    const videoaspect = document.getElementById('videoaspect');
    const button = document.getElementById('cnt_aspect');
    //toggle three states: 16/9, 4/3, aspect ratio of your window
    if (videoaspect.style.aspectRatio === '16 / 9') {
        videoaspect.style.aspectRatio = '4 / 3';
        button.innerHTML = '4/3';
    } else if (videoaspect.style.aspectRatio === '4 / 3') {
        videoaspect.style.aspectRatio = `${window.innerWidth / window.innerHeight}`;
        button.innerHTML = '⛶ ';
    } else {
        videoaspect.style.aspectRatio = '16 / 9';
        button.innerHTML = '16/9';
    }
};


// if there is an error playing the video, sleep 1 sec and try again
document.getElementById('video').addEventListener('error', function() {
    //alert('Error playing video, retrying in 1 second...');
    popup('Error playing, retrying...');
    setTimeout(function() {
      //  document.getElementById('video').load();
        document.getElementById('video').play()
    }, 1000);
});

const irFlash = [
  { color: "red" },
  { color: "white" },
];

const irFlashTiming = {
  duration: 100,
  iterations: 1,
};


function sendCode(buttonName, buttonValue) {
    popup('IR '+buttonValue);
    const dataString = encodeURIComponent(buttonName) + '=' + encodeURIComponent(buttonValue);
    const xhr = new XMLHttpRequest(); // Create XHR object
    xhr.open('POST', ''); // Set request method and URL
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onload = () => {
      if (xhr.status === 200) {
        // console.log('Button code submitted successfully:', buttonName, buttonValue);
          ir_elem = document.getElementById('ir');
          if (ir_elem) {
                ir_elem.style.display = 'block';
                document.getElementById('ir').animate(irFlash, irFlashTiming);
                setTimeout(() => {
                    ir_elem.style.display = 'none';
                }, 250);
            } else {
                console.log('No IR element found');
            }
      } else {
        console.error('Error submitting:', xhr.statusText);
        popup('IR control err');
      }
    };
    xhr.send(dataString);
}



function handleKey(event) {
    //console.log('KBD detected:', event.key);

    // if the key is a Tab, toggle remote
    if (event.key === 'Tab') {
        toggleRemoteAndControls();
        event.preventDefault(); // Prevent default tab behavior
        return;
    }

    const name = 'fromKBD_'+event.keyCode ;
    if (keyMap.has(event.key)) {
        event.preventDefault();
        const value = keyMap.get(event.key);
        sendCode(name, value);
    }
};

document.body.addEventListener('keydown', handleKey);


</script>


</body>
</html>
