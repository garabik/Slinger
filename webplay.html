<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>WebPlay</title>
        <style>
#player {
    display: flex;
    width: auto;    /* starting size, can be whatever */
    height: auto;   /* or you can let height:auto */
    margin: auto;
}

#remote {
        flex: 0 0 auto;
        top: 0;
        left: 0;
        height: 100vh;
        max-width: 50vw;
        width: 100%;
        display: flex;
        justify-content: left;
        align-items: center;
        border: none;
        background-color: rgba(0, 0, 0, 0.2);
    }
    
#remote iframe {
                width: 100%;
                height: 101vh;
                border: none;
                overflow: scroll;
                display: block;
            }

#videowrap {
        flex: 1 1 auto;
                display: flex;
                justify-content: center;
                align-items: center;
                max-width: 100%;
                max-height: 100%;
                height: 100vh;
                width: auto;
                margin: 0 auto;
                background-color: green;
}

            video {
                object-fit: contain;
                max-width: 100%;
                width: 100%;
/*                aspect-ratio: 4 / 3; */
                background-color: red;
            }

body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

html {
                height: 100%;
                width: 100%;
            }
        </style>
    </head>
<body>
<div id="player">
   <div id="remote" style="display: flex" >
    <iframe src="/Remote" ></iframe>
   </div>
  <div id="videowrap">
    <video controls preload="none" >
        <source src="/slingbox" type="video/mp4" />
        Your browser does not support the video tag.
    </video>
  </div>
</div> <!-- player -->

<script>
// function to toggle remote
function toggleRemote() {
    var remoteDiv = document.getElementById('remote');
    if (remoteDiv.style.display === 'none' || remoteDiv.style.display === '') {
        remoteDiv.style.display = 'flex'; // Show the remote
    } else {
        remoteDiv.style.display = 'none'; // Hide the remote
    }
}
// capture click on the video element to toggle visibility of the remote div
document.getElementById('videowrap').addEventListener('click', function() {
    alert("Click on the video to toggle the remote control visibility.");
    toggleRemote();
    event.stopPropagation();
});


</script>

</body>
</html>
