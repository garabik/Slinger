<html>
    <head>
        <meta charset="UTF-8">
        <title>WebPlay</title>
        <style>
            #remote {
                /* on top (covering) of video, to the left */
                position: absolute;
                top: 0;
                left: 0;
                z-index: 10;
                height: 99vh;
                max-width: 100vw;
                display: flex;
                justify-content: center;
                align-items: center;
                border: none;
            }
            #remote iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
            #video {
                position: relative;
                z-index: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                max-width: 100%;
                max-height: 100%;
                height: 100vh;
                width: 100vw;
                margin: 0 auto;
                background-color: white;
            }
            video {
                width: 100%;
                height: 100%;
                object-fit: fill;
                aspect-ratio: 4 / 3;
            }
        </style>
    </head>
<body>
<div id="remote">
<iframe src="/Remote" ></iframe>
</div>
<div id="video">
<video controls preload="none" >
  <source src="/slingbox" type="video/mp4" />
  Your browser does not support the video tag.
</video>
</div>

<script>
// capture click on the video element to toggle visibility of the remote div
document.getElementById('video').addEventListener('click', function() {
    var remoteDiv = document.getElementById('remote');
    if (remoteDiv.style.display === 'none' || remoteDiv.style.display === '') {
        remoteDiv.style.display = 'flex'; // Show the remote
    } else {
        remoteDiv.style.display = 'none'; // Hide the remote
    }
    // Prevent the video from pausing when clicking
    event.stopPropagation();
});

</script>

</body>
</html>
